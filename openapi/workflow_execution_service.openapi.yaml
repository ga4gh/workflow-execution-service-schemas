      deprecated: false
components:
  schemas:
    ServiceInfo:
      title: ServiceInfo
      allOf:
        - $ref: 'https://raw.githubusercontent.com/ga4gh-discovery/ga4gh-service-info/v1.0.0/service-info.yaml#/components/schemas/Service'
        - type: object
          properties:
            workflow_type:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/WorkflowType'
            workflow_type_versions:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/WorkflowTypeVersion'
            supported_wes_versions:
              type: array
              items:
                type: string
              description: The version(s) of the WES schema supported by this service
            supported_filesystem_protocols:
              type: array
              items:
                type: string
              description: The filesystem protocols supported by this service, currently these may include common protocols using the terms 'http', 'https', 'sftp', 's3', 'gs', 'file', or 'synapse', but others  are possible and the terms beyond these core protocols are currently not fixed.   This section reports those protocols (either common or not) supported by this WES service.
            workflow_engine:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/WorkflowEngine'
            workflow_engine_versions:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/WorkflowEngineVersion'
            default_workflow_engine_parameters:
              type: array
              items:
                $ref: '#/components/schemas/DefaultWorkflowEngineParameter'
              description: Each workflow engine can present additional parameters that can be sent to the workflow engine. This message will list the default values, and their types for each workflow engine.
            system_state_counts:
              type: object
              additionalProperties:
                type: integer
                format: int64
              description: >-
                The system statistics, key is the statistic, value is the count of runs in that state.
                See the State enum for the possible keys.
            auth_instructions_url:
              type: string
              description: A web page URL with human-readable instructions on how to get an authorization token for use with a specific WES endpoint.
            tags:
              type: object
              additionalProperties:
                type: string
                description: Tags containing useful information about the WES service.
          required:
            - workflow_type_versions
            - supported_wes_versions
            - supported_filesystem_protocols
            - workflow_engine_versions
            - default_workflow_engine_parameters
            - system_state_counts
            - auth_instructions_url
            - tags
    RunId:
      title: RunId
      type: object
      properties:
        run_id:
          type: string
          description: workflow run ID
    State:
      title: State
      enum:
        - UNKNOWN
        - QUEUED
        - INITIALIZING
        - RUNNING
        - PAUSED
        - COMPLETE
        - EXECUTOR_ERROR
        - SYSTEM_ERROR
        - CANCELED
        - CANCELING
        - PREEMPTED
      type: string
      description: |
        State can take any of the following values:

          + UNKNOWN: The state of the task is unknown. This provides a safe default for messages where this field is missing, for example, so that a missing field does not accidentally imply that the state is QUEUED.

          + QUEUED: The task is queued.

          + INITIALIZING: The task has been assigned to a worker and is currently preparing to run. For example, the worker may be turning on, downloading input files, etc.

          + RUNNING: The task is running. Input files are downloaded and the first Executor has been started.

          + PAUSED: The task is paused. An implementation may have the ability to pause a task, but this is not required.

          + COMPLETE: The task has completed running. Executors have exited without error
          and output files have been successfully uploaded.

          + EXECUTOR_ERROR: The task encountered an error in one of the Executor processes. Generally,
        this means that an Executor exited with a non-zero exit code.

          + SYSTEM_ERROR: The task was stopped due to a system error, but not from an Executor,
        for example an upload failed due to network issues, the worker's ran out of disk space, etc.

          + CANCELED: The task was canceled by the user.

          + CANCELING: The task was canceled by the user, and is in the process of stopping.

          + PREEMPTED: The task is stopped (preempted) by the system. The reasons for this would be tied to
        the specific system running the job. Generally, this means that the system reclaimed the compute
        capacity for reallocation.
    RunStatus:
      title: RunStatus
      required:
        - run_id
      type: object
      properties:
        run_id:
          type: string
        state:
          $ref: '#/components/schemas/State'
      description: State information of a workflow run
    RunSummary:
      title: RunSummary
      allOf:
        - $ref: '#/components/schemas/RunStatus'
        - type: object
          properties:
            start_time:
              type: string
              description: When the run started executing, in ISO 8601 format "%Y-%m-%dT%H:%M:%SZ"
            end_time:
              type: string
              description: When the run stopped executing (completed, failed, or cancelled), in ISO 8601 format "%Y-%m-%dT%H:%M:%SZ"
            tags:
              type: object
              description: Arbitrary key/value tags added by the client during run creation 
              additionalProperties:
                type: string
          required:
            - tags
      description: Small description of a workflow run
    RunRequest:
      title: RunRequest
      type: object
      required:
      - workflow_type
      - workflow_type_version
      - workflow_url
      properties:
        workflow_params:
          type: object
          description: >-
            OPTIONAL

            The workflow run parameterizations (JSON encoded), including input and output file locations.
            Either `workflow_params` or `workflow_unified_params` must be provided, `workflow_unified_params` takes precedence.
        workflow_unified_params:
          type: object
          description: >-
            OPTIONAL

            Unified parameter format that can be converted to workflow-language-specific format.
            If provided, takes precedence over workflow_params. WES implementations should
            convert these to the appropriate native format for the specified workflow_type.
          properties:
            version:
              type: string
              description: Version of the unified parameter format
              default: "1.0"
            parameters:
              type: object
              additionalProperties:
                type: object
                properties:
                  type:
                    type: string
                    enum: ["String", "Integer", "Float", "Boolean", "File", "Directory", "Array", "Object"]
                    description: Parameter type
                  value:
                    description: Parameter value (type depends on 'type' field)
                  element_type:
                    type: string
                    description: For Array types, specifies the type of array elements
                  file_metadata:
                    type: object
                    description: Optional metadata for File and Directory types
                    properties:
                      size:
                        type: integer
                        description: File size in bytes
                        format: int64
                      checksum:
                        type: string
                        description: File checksum in format 'algorithm:hash' (e.g., 'sha256:abc123...')
                      secondary_files:
                        type: array
                        items:
                          type: string
                        description: Related files such as indexes or companion files
                      format:
                        type: string
                        description: File format or MIME type
                      last_modified:
                        type: string
                        description: Last modification time in ISO 8601 format
                  description:
                    type: string
                    description: Human-readable parameter description
                  optional:
                    type: boolean
                    default: false
                    description: Whether this parameter is optional
                  default:
                    description: Default value if parameter not provided (type depends on 'type' field)
                  constraints:
                    type: object
                    description: Validation constraints for the parameter value
                    properties:
                      min:
                        description: Minimum value (for numeric types)
                      max:
                        description: Maximum value (for numeric types)
                      min_length:
                        type: integer
                        description: Minimum length (for String types)
                      max_length:
                        type: integer
                        description: Maximum length (for String types)
                      pattern:
                        type: string
                        description: Regular expression pattern (for String types)
                      enum:
                        type: array
                        items:
                          description: Allowed value (type matches parameter type)
                        description: List of allowed values
                      min_items:
                        type: integer
                        description: Minimum number of items (for Array types)
                      max_items:
                        type: integer
                        description: Maximum number of items (for Array types)
                required:
                  - type
                  - value
        workflow_type:
          type: string
          description: >-
            REQUIRED

            Workflow descriptor type, must be "CWL", "WDL", "Nextflow", or "Snakemake" currently (or another alternative supported by this WES instance, see service-info for supported types)
        workflow_type_version:
          type: string
          description: >-
            REQUIRED

            The workflow descriptor type version, must be one supported by this WES instance (see service-info for supported versions)
        tags:
          type: object
          additionalProperties:
            type: string
          description: >-
            OPTIONAL

            Arbitrary key-value tags to associate with the workflow run for organization, tracking, or metadata purposes. Examples include experiment names, user identifiers, sample IDs, or project codes.
        workflow_engine_parameters:
          type: object
          additionalProperties:
            type: string
        workflow_engine:
          type: string
          description: >-
            OPTIONAL

            The workflow engine, must be one supported by this WES instance (see service-info for supported engines). Required if workflow_engine_version is provided.
        workflow_engine_version:
          type: string
          description: >-
            OPTIONAL

            The workflow engine version, must be one supported by this WES instance (see service-info for supported engine versions). If workflow_engine is provided, but workflow_engine_version is not, servers can make no assumptions with regard to the engine version the WES instance uses to process the request if that WES instance supports multiple versions of the requested engine.
        workflow_url:
          type: string
          description: >-
            REQUIRED

            The primary workflow document. When `workflow_attachments` is used to attach files, the `workflow_url` may be a relative path to one of the attachments that is the primary workflow to be executed.
        additional_workflow_urls:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                description: URL to the workflow file (absolute URL or relative to uploaded attachments)
              filename:
                type: string
                description: Target filename, possibly including relative path, where this file should be placed e.g. 'workflows/helper.wdl'. Subdirectories are allowed but parent directory references ('..') are prohibited for security purposes.
            required:
              - url
              - filename
          description: >-
            OPTIONAL

            Additional workflow files required for execution (e.g., imported workflows, subworkflows, or dependencies). Each entry specifies both the source URL and target file path for precise file placement.
      description: >-
        To execute a workflow, send a run request including all the details needed to begin downloading

        and executing a given workflow.

        If workflow_engine and workflow_engine_version are not provided, servers can use the most recent workflow_engine_version of workflow_engine that WES instance uses to process the request if 
        
        supports for the requested workflow_type.
    RunLog:
      title: RunLog
      type: object
      properties:
        run_id:
          type: string
          description: workflow run ID
        request:
          $ref: '#/components/schemas/RunRequest'
        state:
          $ref: '#/components/schemas/State'
        run_log:
          $ref: '#/components/schemas/Log'
        task_logs_url:
          type: string
          description: A reference to the complete url which may be used to obtain a paginated list of task logs for this workflow
        task_logs:
          type: array
          deprecated: true
          nullable: true
          items:
            anyOf:
              - $ref: '#/components/schemas/Log'
              - $ref: '#/components/schemas/TaskLog'
          description:  >-
              The logs, and other key info like timing and exit code, for each step in the workflow run.
              This field is deprecated and the `task_logs_url` should be used to retrieve a paginated list
              of steps from the workflow run. This field will be removed in the next major version of the 
              specification (2.0.0)
        outputs:
          type: object
          description: The outputs from the workflow run (legacy format)
        structured_outputs:
          $ref: '#/components/schemas/WorkflowOutputs'
          description: Structured workflow outputs with rich metadata and type safety
    Log:
      title: Log
      type: object
      properties:
        name:
          type: string
          description: The task or workflow name
        cmd:
          type: array
          items:
            type: string
          description: The command line that was executed
        start_time:
          type: string
          description: When the command started executing, in ISO 8601 format "%Y-%m-%dT%H:%M:%SZ"
        end_time:
          type: string
          description: When the command stopped executing (completed, failed, or cancelled), in ISO 8601 format "%Y-%m-%dT%H:%M:%SZ"
        stdout:
          type: string
          description: A URL to retrieve standard output logs of the workflow run or task.  This URL may change between status requests, or may not be available until the task or workflow has finished execution.  Should be available using the same credentials used to access the WES endpoint.
        stderr:
          type: string
          description: A URL to retrieve standard error logs of the workflow run or task.  This URL may change between status requests, or may not be available until the task or workflow has finished execution.  Should be available using the same credentials used to access the WES endpoint.
        exit_code:
          type: integer
          description: Exit code of the program
          format: int32
        system_logs:
          type: array
          items:
            type: string

          description: |-
            System logs are any logs the system decides are relevant,
            which are not tied directly to a workflow.
            Content is implementation specific: format, size, etc.

            System logs may be collected here to provide convenient access.

            For example, the system may include an error message that caused
            a SYSTEM_ERROR state (e.g. disk is full), etc.
      description: Log and other info
    DefaultWorkflowEngineParameter:
      title: DefaultWorkflowEngineParameter
      type: object
      properties:
        name:
          type: string
          description: The name of the parameter
        type:
          type: string
          description: Describes the type of the parameter, e.g. float.
        default_value:
          type: string
          description: The stringified version of the default parameter. e.g. "2.45".
      description: A message that allows one to describe default parameters for a workflow engine.
    WorkflowType:
      title: WorkflowType
      type: object
      properties:
        workflow_type:
          type: array
          items:
            type: string
          description: an array of one or more acceptable types for the `workflow_type`, must be "CWL", "WDL", "Nextflow", or "Snakemake" currently (or another alternative supported by this WES instance, see service-info)
      description: Available workflow types supported by a given instance of the service.
    WorkflowTypeVersion:
      title: WorkflowTypeVersion
      type: object
      properties:
        workflow_type_version:
          type: array
          items:
            type: string
          description: an array of one or more acceptable type and versions for the `workflow_type`. Use the convention `<workflow_type>_<version>` to encode this array for clarity. For example, a WES service supporting CWL 1.0 and WDL 1.1 would encode this as `["CWL_1.0", "WDL_1.1"]`.
      description: Available workflow type versions supported by a given instance of the service.
    TaskListResponse:
      title: TaskListResponse
      type: object
      properties:
        task_logs:
          type: array
          items:
            $ref: '#/components/schemas/TaskLog'
          description: The logs, and other key info like timing and exit code, for each step in the workflow run.
        next_page_token:
          type: string
          description: >-
            A token which may be supplied as `page_token` in workflow run task list request to get the next page
            of results.  An empty string indicates there are no more items to return.
      description: The service will return a TaskListResponse when receiving a successful TaskListRequest.
    TaskLog:
      title: TaskLog
      allOf:
        - $ref: '#/components/schemas/Log'
        - type: object
          properties:
            id:
              type: string
              description: A unique identifier which may be used to reference the task
            system_logs:
              type: array
              items:
                type: string

              description: |-
                System logs are any logs the system decides are relevant,
                which are not tied directly to a task.
                Content is implementation specific: format, size, etc.
                
                System logs may be collected here to provide convenient access.
                
                For example, the system may include the name of the host
                where the task is executing, an error message that caused
                a SYSTEM_ERROR state (e.g. disk is full), etc.
            tes_uri:
              type: string
              description: An optional URL pointing to an extended task definition defined by a [TES api](https://github.com/ga4gh/task-execution-schemas)
      required:
        - id
        - name
      description: Runtime information for a given task
    WorkflowEngineVersion:
      title: WorkflowEngineVersion
      type: object
      properties:
        workflow_engine_version:
          type: array
          items:
            type: string
          description: An array of one or more acceptable engines versions for the `workflow_engine`. Since a server may support multiple engines and version, the recommendation is to encode this array as `<workflow_engine>_<version>` for clarity.
      description: Available workflow engine versions supported by a given instance of the service.
    WorkflowEngine:
      title: WorkflowEngine
      type: object
      properties:
        workflow_engine:
          type: array
          items:
            type: string
          description: An array of one or more acceptable workflow engines. Since a server may support multiple engines and version, the recommendation is to encode the workflow_engine_version array as `<workflow_engine>_<version>` where `workflow_engine` values match this array for clarity.
      description: Available workflow engines supported by a given instance of the service.
    RunListResponse:
      title: RunListResponse
      type: object
      properties:
        runs:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/RunStatus'
              - $ref: '#/components/schemas/RunSummary'
          description: A list of workflow runs that the service has executed or is executing. The list is filtered to only include runs that the caller has permission to see.
        next_page_token:
          type: string
          description: A token which may be supplied as `page_token` in workflow run list request to get the next page of results.  An empty string indicates there are no more items to return.
        total_runs:
          type: integer
          description: >-
            Total count of workflow runs that the service has executed or is executing and the caller has permission to see.
      description: >
              The service will return a RunListResponse when receiving a successful RunListRequest.
              DEPRECIATION WARNING: The use of `RunStatus` as the schema for `runs` array items will
              not be permitted from the next major version of the specification (2.0.0) onwards. We
              encourage implementers to use `RunSummary` instead.
    ErrorResponse:
      title: ErrorResponse
      type: object
      properties:
        msg:
          type: string
          description: A detailed error message.
        status_code:
          type: integer
          description: The integer representing the HTTP status code (e.g. 200, 404).
          format: int32
      description: An object that can optionally include information about the error.
    WorkflowOutputs:
      title: WorkflowOutputs
      type: object
      description: Structured workflow outputs with rich metadata and provenance information
      properties:
        version:
          type: string
          description: Version of the structured outputs format
          default: "1.0"
        outputs:
          type: object
          description: Named workflow outputs with structured metadata
          additionalProperties:
            $ref: '#/components/schemas/OutputObject'
    OutputObject:
      title: OutputObject
      type: object
      description: A structured output object with metadata and provenance information
      properties:
        class:
          type: string
          enum: ["File", "Directory", "Array", "String", "Integer", "Float", "Boolean"]
          description: Type of the output object
        value:
          description: Output value (type depends on class field)
        location:
          type: string
          description: Absolute path or URL to the output file/directory (for File/Directory class)
        basename:
          type: string
          description: Filename without directory path (for File/Directory class)
        size:
          type: integer
          format: int64
          description: Size in bytes (for File/Directory class)
        checksum:
          type: string
          description: File integrity hash in format 'algorithm:hash' (e.g., 'sha256:abc123...')
        format:
          type: string
          description: MIME type or format identifier (e.g., EDAM ontology reference)
        items:
          type: array
          items:
            $ref: '#/components/schemas/OutputObject'
          description: Array elements (for Array class)
        metadata:
          type: object
          description: Additional metadata about the output
          properties:
            created:
              type: string
              description: Creation timestamp in ISO 8601 format
            source_task:
              type: string
              description: Task/step that generated this output
            task_id:
              type: string
              description: Unique identifier of the generating task
            command:
              type: array
              items:
                type: string
              description: Command line that generated this output
            description:
              type: string
              description: Human-readable description of the output
        secondary_files:
          type: array
          items:
            $ref: '#/components/schemas/OutputObject'
          description: Associated files (e.g., index files, companion files)
        contents:
          type: string
          description: File contents for small files (≤64 KiB)
      required:
        - class
        - value





