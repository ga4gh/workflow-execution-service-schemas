      <SchemaDefinition schemaRef="#/components/schemas/State" />
  - name: runstatus_model
    x-displayName: RunStatus
    description: |
      <SchemaDefinition schemaRef="#/components/schemas/RunStatus" />
  - name: runsummary_model
