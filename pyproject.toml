[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wes-structured-logs"
version = "0.1.0"
description = "Parse Snakemake and Nextflow logs into WES-aligned structured Log / TaskLog payloads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wes_structured_logs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
